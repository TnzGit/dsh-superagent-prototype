name: Local-first core tests
on:
  push:
    branches: [feat/local-first-wechat-foundation]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
# Cancel stale branch runs, including older tests that deadlocked before queue-state timeouts existed.
concurrency:
  group: local-first-native-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  local-first-core:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - run: pnpm install --frozen-lockfile
      - name: Pure scheduling, path and DSH-native Weixin tests (no credentials)
        run: node --experimental-strip-types --test tests/local-model-queue.node-test.mjs tests/local-projects.node-test.mjs tests/local-project-workspaces.node-test.mjs tests/local-existing-dsh-projects.node-test.mjs tests/local-dsh-3080-bridge.node-test.mjs tests/local-dsh-3080-model-gate.node-test.mjs tests/local-dsh-3080-new-workspace.node-test.mjs tests/local-dsh-3080-operator-rpc.node-test.mjs tests/local-dsh-3080-operator-provision.node-test.mjs tests/local-dsh-3080-probe.node-test.mjs tests/local-dsh-3080-output.node-test.mjs tests/local-dsh-relay-store.node-test.mjs tests/local-dsh-relay-routing.node-test.mjs tests/local-dsh-relay-coordinator.node-test.mjs tests/local-weixin-native.node-test.mjs tests/local-weixin-qr.node-test.mjs tests/local-nongit-apply.node-test.mjs tests/local-nongit-batch-stage.node-test.mjs tests/local-nongit-batch-recovery.node-test.mjs tests/local-nongit-batch-audit.node-test.mjs tests/local-nongit-batch-executor.node-test.mjs tests/local-nongit-synthetic-approval-ledger.node-test.mjs scripts/probe-local-llm.node-test.mjs
      - name: OpenAI queue proxy integration tests (bounded execution)
        run: timeout -k 5s 45s node --experimental-strip-types --test tests/local-openai-queue-proxy.node-test.mjs

  macos-portability:
    runs-on: macos-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - run: pnpm install --frozen-lockfile
      - name: Verify native Weixin tests against macOS canonicalization and Node 25
        run: node --experimental-strip-types --test tests/local-model-queue.node-test.mjs tests/local-projects.node-test.mjs tests/local-project-workspaces.node-test.mjs tests/local-existing-dsh-projects.node-test.mjs tests/local-dsh-3080-bridge.node-test.mjs tests/local-dsh-3080-model-gate.node-test.mjs tests/local-dsh-3080-new-workspace.node-test.mjs tests/local-dsh-3080-operator-rpc.node-test.mjs tests/local-dsh-3080-operator-provision.node-test.mjs tests/local-dsh-3080-probe.node-test.mjs tests/local-dsh-3080-output.node-test.mjs tests/local-dsh-relay-store.node-test.mjs tests/local-dsh-relay-routing.node-test.mjs tests/local-dsh-relay-coordinator.node-test.mjs tests/local-weixin-native.node-test.mjs tests/local-weixin-qr.node-test.mjs tests/local-nongit-apply.node-test.mjs tests/local-nongit-batch-stage.node-test.mjs tests/local-nongit-batch-recovery.node-test.mjs tests/local-nongit-batch-audit.node-test.mjs tests/local-nongit-batch-executor.node-test.mjs tests/local-nongit-synthetic-approval-ledger.node-test.mjs scripts/probe-local-llm.node-test.mjs
      - name: Verify model queue proxy across macOS streams
        run: node --experimental-strip-types --test tests/local-openai-queue-proxy.node-test.mjs

  dsh-typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
