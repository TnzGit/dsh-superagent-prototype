name: Local-first core tests
on:
  pull_request:
  push:
    branches: [feat/local-first-wechat-foundation]
  workflow_dispatch:
permissions:
  contents: read
# Cancel stale branch runs, including older tests that deadlocked before queue-state timeouts existed.
concurrency:
  group: local-first-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  local-first-core:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure scheduling, path, Weixin and OpenClaw tests (no credentials)
        run: node --experimental-strip-types --test tests/local-model-queue.node-test.mjs tests/local-projects.node-test.mjs tests/local-weixin-bridge.node-test.mjs tests/local-openclaw-plugin.node-test.mjs scripts/probe-local-llm.node-test.mjs
      - name: OpenAI queue proxy integration tests (bounded execution)
        run: timeout -k 5s 45s node --experimental-strip-types --test tests/local-openai-queue-proxy.node-test.mjs

  dsh-typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
