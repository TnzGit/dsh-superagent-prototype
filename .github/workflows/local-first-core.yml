name: Local-first core tests
on:
  pull_request:
  push:
    branches: [feat/local-first-wechat-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-first-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and simulated HTTP bridge tests (no external credentials)
        run: node --experimental-strip-types --test tests/local-*.node-test.mjs scripts/probe-local-llm.node-test.mjs
